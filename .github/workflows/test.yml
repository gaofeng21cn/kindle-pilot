name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      KINDLE_KC_ARCHIVE: work/kc-ivy_1.0.30.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Lua daemon test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y luajit lua-socket libssl-dev
      - name: Fetch pinned KC adapter for headless integration tests
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('manifests/compatibility.json').read_text())
          route = next(r for r in manifest['routes'] if r['id'] == 'vera-cs-5.20.1.0.2')
          asset = next(a for a in route['assets'] if a['name'] == route['native_collections']['asset'])
          raw = urllib.request.urlopen(asset['url'], timeout=60).read()
          assert hashlib.sha256(raw).hexdigest() == asset['sha256']
          target = Path(os.environ['KINDLE_KC_ARCHIVE'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          PY
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: python scripts/check-package.py
