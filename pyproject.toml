[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-agent-companion"
version = "0.1.0"
description = "Agent-first Kindle jailbreak, KOReader, plugin, and library workflow manager"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gaofeng"}]
dependencies = []

[project.scripts]
kindle-companion = "kindle_companion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
